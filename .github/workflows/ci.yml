name: CI

# Also called by release.yml, so a release runs exactly these checks before it publishes. Pushes
# of tags don't run it on their own: a release's tag points at a commit main already tested, and
# release.yml runs these checks itself.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:bundle
      - run: npm run test:licenses
      # Firefox only gets WebGL through a display, so give it a virtual one.
      - run: xvfb-run -a npm run test:e2e
