name: Publish Package to npmjs
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm 11.5 or later.
      - run: npm install -g npm@latest
      - name: Check the release tag names the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ] && [ "$TAG" != "$version" ]; then
            echo "Release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:bundle
      - run: npm run test:licenses
      - run: npm run test:e2e
      - run: npm run build
      # No token: npm's trusted publisher for @sjvair/map-sdk authorizes this workflow. A
      # prerelease (a version with "-") goes to the "next" dist-tag, not "latest".
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi
