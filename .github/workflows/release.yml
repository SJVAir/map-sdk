name: Publish Package to npmjs
on:
  release:
    types: [published]
jobs:
  # Fail fast, before the long checks, when the tag doesn't name the package version.
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the release tag names the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ] && [ "$TAG" != "$version" ]; then
            echo "Release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
  # The same checks as every push and pull request: one copy, in ci.yml.
  test:
    needs: tag
    uses: ./.github/workflows/ci.yml
  # Publishing stays in this file: npm's trusted publisher for @sjvair/map-sdk names release.yml.
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm 11.5 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      # No token: npm's trusted publisher authorizes this workflow. `prepack` builds dist. A
      # prerelease (a version with "-") goes to the "next" dist-tag, not "latest".
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi
